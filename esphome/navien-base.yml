# Basic Config

external_components:
  - source: /config/packages/sensors/navien/components

binary_sensor:

switch:
  - platform: navien
    navien: navien_main
    type: power
    name: ${device_friendly_name} Main Power
    id: main_power
  # "Allow Recirculation" turns on recirculation when the water heater is not in HotButton mode
  - platform: navien
    navien: navien_main
    type: allow_scheduled_recirc
    name: "${device_friendly_name} Allow Recirculation"
    id: allow_scheduled_recirc

button:
  - platform: restart
    name: "${device_friendly_name} Restart"

text_sensor:
  - platform: version
    name: "${device_friendly_name} ESPHome Version"
    id: esphome_version
    hide_timestamp: True

  - platform: wifi_info
    ip_address:
      id: ip_address
      name: "${device_friendly_name} IP Address"
    mac_address:
      name: "${device_friendly_name} Mac"
      id: mac_address

climate:
  - platform: navien
    navien: navien_main
    id: navien_climate
    visual:
      min_temperature: 95F
      max_temperature: 120F
      temperature_step: '1°F'
    name: "${device_friendly_name} DHW Set Temperature"

